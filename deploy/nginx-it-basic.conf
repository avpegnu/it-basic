# =============================================================
#  Nginx config cho IT Basic (site tĩnh) — it.avpegnu.io.vn
#
#  Đặt tại : /etc/nginx/sites-available/it-basic
#  Symlink : /etc/nginx/sites-enabled/it-basic
#
#  File RIÊNG, không đụng tới /etc/nginx/sites-available/sslm
#  đang phục vụ 3 service hiện có:
#      api.avpegnu.io.vn     -> localhost:3000
#      avpegnu.io.vn         -> localhost:3001
#      manage.avpegnu.io.vn  -> localhost:3002
#
#  Khác biệt: 3 service kia là reverse proxy sang Node.
#  Site này phục vụ file tĩnh trực tiếp, không cần proxy, không cần port.
# =============================================================

server {
    listen 80;
    listen [::]:80;

    # Nginx khớp server_name chính xác TRƯỚC khi rơi về default_server
    # (site `default` đang giữ default_server trên cổng 80),
    # nên block này nhận đúng request của subdomain, không ảnh hưởng site cũ.
    server_name it.avpegnu.io.vn;

    root  /var/www/it-basic;
    index index.html;

    # Log riêng cho site này, dễ debug, không lẫn với site cũ
    access_log /var/log/nginx/it-basic.access.log;
    error_log  /var/log/nginx/it-basic.error.log;

    charset utf-8;

    # ---- Bảo mật cơ bản ----
    server_tokens off;
    add_header X-Content-Type-Options nosniff       always;
    add_header X-Frame-Options        SAMEORIGIN    always;
    add_header Referrer-Policy        no-referrer-when-downgrade always;

    # ---- Nén ----
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript
                      application/javascript application/json
                      image/svg+xml application/xml;

    # ---- Định tuyến ----
    # Thư mục có tên chứa dấu cách ("Programming Language") vẫn hoạt động
    # bình thường, trình duyệt tự encode thành %20.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # ---- Cache tài nguyên tĩnh ----
    # CSS/JS cache 7 ngày (đủ lâu để nhanh, đủ ngắn để cập nhật bài mới)
    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Ảnh/font cache 30 ngày
    location ~* \.(png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # HTML KHÔNG cache — để sửa bài xong là thấy ngay, không phải Ctrl+F5
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ---- Chặn truy cập file ẩn (.git, .env, .DS_Store...) ----
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# Sau khi chạy certbot, nó sẽ TỰ ĐỘNG:
#   - thêm block listen 443 ssl + đường dẫn certificate
#   - thêm redirect 80 -> 443
# Bạn không cần sửa tay phần HTTPS.
