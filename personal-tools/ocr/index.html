<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f8f5" />
    <meta
      name="description"
      content="Trích xuất văn bản tiếng Việt và tiếng Anh từ ảnh."
    />
    <title>Ảnh → Văn bản — Personal Tools</title>
    <link rel="icon" href="../assets/favicon.svg" />
    <link rel="stylesheet" href="../assets/styles.css" />
    <script src="../assets/vendor/tesseract/tesseract.min.js" defer></script>
    <script src="../assets/common.js" defer></script>
    <script src="../assets/ocr.js" defer></script>
  </head>
  <body>
    <header class="header">
      <a class="brand" href="../" aria-label="Personal Tools — Trang chủ"
        ><span class="brand-mark" aria-hidden="true">⌘</span>personal<span
          class="brand-light"
          >tools</span
        ><span class="brand-dot">.</span></a
      ><a class="header-back" href="../">← Tất cả công cụ</a>
    </header>
    <main class="container workspace">
      <nav class="breadcrumb" aria-label="Đường dẫn">
        <a href="../">Công cụ</a><span aria-hidden="true">/</span
        ><span>Ảnh → Văn bản</span>
      </nav>
      <div class="page-heading"><h1>Ảnh → Văn bản</h1></div>
      <noscript
        ><p class="status error">
          Cần bật JavaScript để sử dụng công cụ.
        </p></noscript
      >
      <div class="work-grid">
        <section class="panel" aria-labelledby="image-heading">
          <div class="panel-heading">
            <h2 id="image-heading">Ảnh</h2>
            <button type="button" class="text-button" id="clear-image">
              Xóa
            </button>
          </div>
          <input
            id="image-input"
            type="file"
            accept="image/png,image/jpeg,image/webp,image/bmp"
            hidden
          />
          <button
            id="drop-zone"
            class="drop-zone"
            type="button"
            aria-describedby="upload-help"
          >
            <span class="upload-icon" aria-hidden="true"
              ><svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
              >
                <path
                  d="M12 16V3m-5 5 5-5 5 5M4 15v5a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-5"
                /></svg></span
            ><strong>Kéo ảnh vào đây</strong
            ><span>hoặc <span class="upload-link">chọn ảnh</span></span
            ><span class="file-types" id="upload-help"
              >PNG, JPG, WebP, BMP · Tối đa 20 MB</span
            >
          </button>
          <div class="paste-hint">
            Dán ảnh: <kbd id="paste-shortcut">Ctrl + V</kbd>
          </div>
          <div id="image-preview" class="image-preview" hidden>
            <canvas id="image-canvas" aria-label="Ảnh cần nhận dạng"></canvas>
            <div class="preview-caption"><span id="file-name"></span></div>
          </div>
          <div class="ocr-settings">
            <label class="field-label" for="ocr-language">Ngôn ngữ</label
            ><select id="ocr-language">
              <option value="vie+eng">Tiếng Việt + English</option>
              <option value="vie">Tiếng Việt</option>
              <option value="eng">English</option>
            </select>
          </div>
          <div class="result-actions">
            <button
              type="button"
              id="recognize"
              class="button primary"
              disabled
            >
              Trích xuất văn bản</button
            ><button
              type="button"
              id="cancel-ocr"
              class="button secondary"
              hidden
            >
              Hủy
            </button>
          </div>
          <progress
            id="ocr-progress"
            max="100"
            value="0"
            aria-label="Tiến trình nhận dạng"
            hidden
          ></progress>
          <p
            id="ocr-status"
            class="status"
            role="status"
            aria-live="polite"
          ></p>
        </section>
        <section
          class="panel editor-panel"
          id="ocr-result-panel"
          aria-labelledby="text-heading"
          aria-busy="false"
        >
          <div class="panel-heading">
            <h2 id="text-heading">Văn bản</h2>
            <span id="text-count" class="step-label">0 ký tự</span>
          </div>
          <label class="sr-only" for="ocr-output">Văn bản nhận dạng</label
          ><textarea
            id="ocr-output"
            class="code-editor ocr-output"
            placeholder="Chưa có kết quả"
            spellcheck="false"
          ></textarea>
          <div class="result-actions">
            <button
              type="button"
              id="copy-output"
              class="button secondary"
              disabled
            >
              Sao chép</button
            ><button
              type="button"
              id="download-output"
              class="button secondary"
              disabled
            >
              Tải TXT ↓
            </button>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
