<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f8f5" />
    <meta
      name="description"
      content="Định dạng và xem trước JSON, Markdown, YAML, HTML, CSS."
    />
    <title>Format & Preview — Personal Tools</title>
    <link rel="icon" href="../assets/favicon.svg" />
    <link rel="stylesheet" href="../assets/styles.css" />
    <script src="../assets/vendor/lossless-json.js" defer></script>
    <script src="../assets/vendor/js-yaml.min.js" defer></script>
    <script src="../assets/vendor/prettier/standalone.js" defer></script>
    <script src="../assets/vendor/prettier/markdown.js" defer></script>
    <script src="../assets/vendor/prettier/yaml.js" defer></script>
    <script src="../assets/vendor/prettier/html.js" defer></script>
    <script src="../assets/vendor/prettier/postcss.js" defer></script>
    <script src="../assets/vendor/marked.js" defer></script>
    <script src="../assets/vendor/purify.min.js" defer></script>
    <script src="../assets/common.js" defer></script>
    <script src="../assets/data.js" defer></script>
    <script src="../assets/format.js" defer></script>
  </head>
  <body>
    <header class="header">
      <a class="brand" href="../" aria-label="Personal Tools — Trang chủ"
        ><span class="brand-mark" aria-hidden="true">⌘</span>personal<span
          class="brand-light"
          >tools</span
        ><span class="brand-dot">.</span></a
      ><a class="header-back" href="../">← Tất cả công cụ</a>
    </header>
    <main class="container workspace">
      <nav class="breadcrumb" aria-label="Đường dẫn">
        <a href="../">Công cụ</a><span aria-hidden="true">/</span
        ><span>Format & Preview</span>
      </nav>
      <div class="page-heading"><h1>Format & Preview</h1></div>
      <noscript
        ><p class="status error">
          Cần bật JavaScript để sử dụng công cụ.
        </p></noscript
      >
      <div class="toolbar">
        <div class="toolbar-field">
          <label class="field-label" for="format-type">Định dạng</label
          ><select id="format-type">
            <option value="json">JSON</option>
            <option value="markdown">Markdown</option>
            <option value="yaml">YAML</option>
            <option value="html">HTML</option>
            <option value="css">CSS</option>
          </select>
        </div>
        <div class="toolbar-field">
          <label class="field-label" for="indent-size">Thụt lề</label
          ><select id="indent-size">
            <option value="2">2 khoảng trắng</option>
            <option value="4">4 khoảng trắng</option>
            <option value="tab">Tab</option>
          </select>
        </div>
        <div class="toolbar-actions">
          <button type="button" id="load-file" class="button secondary">
            Mở tệp</button
          ><button type="button" id="load-sample" class="button secondary">
            Mẫu</button
          ><button type="button" id="clear-data" class="text-button">
            Xóa
          </button>
        </div>
      </div>
      <input
        id="text-file"
        type="file"
        accept=".json,.md,.markdown,.yml,.yaml,.html,.htm,.css,.txt"
        hidden
      />
      <div class="work-grid">
        <section class="panel editor-panel" aria-labelledby="source-heading">
          <div class="panel-heading">
            <h2 id="source-heading">Đầu vào</h2>
            <span class="step-label">Ctrl/⌘ + Enter</span>
          </div>
          <label class="sr-only" for="format-input">Dữ liệu đầu vào</label
          ><textarea
            id="format-input"
            class="code-editor"
            placeholder="Dán dữ liệu…"
            spellcheck="false"
          ></textarea>
          <div class="result-actions">
            <button type="button" id="format-data" class="button primary">
              Format & Preview</button
            ><button type="button" id="minify-data" class="button secondary">
              Minify JSON
            </button>
          </div>
        </section>
        <section
          class="panel editor-panel"
          id="format-result-panel"
          aria-labelledby="output-heading"
          aria-busy="false"
        >
          <div class="panel-heading">
            <h2 id="output-heading">Kết quả</h2>
            <div class="view-switch" role="tablist" aria-label="Kiểu xem">
              <button
                type="button"
                class="view-button"
                id="preview-tab"
                role="tab"
                aria-controls="preview-view"
                aria-selected="true"
                tabindex="0"
              >
                Preview</button
              ><button
                type="button"
                class="view-button"
                id="source-tab"
                role="tab"
                aria-controls="source-view"
                aria-selected="false"
                tabindex="-1"
              >
                Mã
              </button>
            </div>
          </div>
          <div
            id="preview-view"
            class="preview-view"
            role="tabpanel"
            aria-labelledby="preview-tab"
          >
            <p class="preview-placeholder">Chưa có dữ liệu</p>
          </div>
          <div
            id="source-view"
            class="source-view"
            role="tabpanel"
            aria-labelledby="source-tab"
            hidden
          >
            <label class="sr-only" for="format-output"
              >Dữ liệu đã định dạng</label
            ><textarea
              id="format-output"
              class="code-editor"
              readonly
              spellcheck="false"
            ></textarea>
          </div>
          <div class="result-actions">
            <button
              type="button"
              id="copy-output"
              class="button secondary"
              disabled
            >
              Sao chép</button
            ><button
              type="button"
              id="download-output"
              class="button secondary"
              disabled
            >
              Tải xuống ↓
            </button>
          </div>
        </section>
      </div>
      <p id="format-status" class="status" role="status" aria-live="polite"></p>
    </main>
  </body>
</html>
